<!doctype html>
<html lang="en">

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#8E2A2A" />
    <title>Shubham & Kajal — Royal Wedding Invitation</title>
    <meta
      name="description"
      content="With the blessings of Shri Ganesh and our beloved families, we joyfully invite you to celebrate the wedding union of Shubham & Kajal. Open the envelope to view our story, scratch to reveal the date, ceremonies, and RSVP."

    <!-- Favicon & Touch Icons -->

    <meta property="og:type" content="website" />

    <meta property="og:title" content="Shubham & Kajal — Royal Wedding Invitation 💍" />

      property="og:description"
      content="Saturday, 21 November 2026 · Vadodara | With the divine blessings of Shri Ganesh and our families, we joyfully invite you to celebrate our wedding. Tap to open your digital royal invitation & RSVP."

    <meta property="og:image" content="/og-image.jpeg" />
    <meta property="og:image:secure_url" content="/og-image.jpeg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="900" />
    <meta property="og:image:height" content="1600" />
    <meta property="og:image:alt" content="Shubham & Kajal Wedding Invitation" />

    <!-- Fallback for legacy WhatsApp and scrapers -->

    <!-- Twitter / iMessage Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shubham & Kajal — Royal Wedding Invitation 💍" />

      name="twitter:description"
      content="Saturday, 21 November 2026 · Vadodara | With the blessings of Shri Ganesh and our families, we joyfully invite you to celebrate our union."
